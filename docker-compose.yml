services:
  ip-checker:
    build: .
    container_name: ip_checker_site
    restart: unless-stopped
    networks:
      private_net:
        ipv4_address: 10.60.0.3
        ports:
        - "8080:80"

networks:
  private_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.60.0.0/24
          gateway: 10.60.0.1
