services:
  ip-checker:
    build: .
    container_name: ip_checker_site
    restart: unless-stopped
    networks:
      private_net:
        ipv4_address: 10.60.0.3
    # Ports removed for security. Access only via internal Docker network or VPN (TUN).
    ports:
    - "8081:81"

networks:
  private_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.60.0.0/24
          gateway: 10.60.0.1
