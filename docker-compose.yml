services:
  ip-checker:
    build: .
    container_name: ip_checker_site
    restart: unless-stopped
    networks:
      private_net:
        ipv4_address: 172.25.0.2
    # Public Access DISABLED
    # Port 80 is NOT exposed to the host.
    # Access is only possible via the internal IP (VPN).
    # ports:
    #   - "80:80"

networks:
  private_net:
    driver: bridge
    ipam:
      config:
        # Using 172.25.0.0/24 for Docker to avoid conflict with VPN (10.60.0.0/24)
        - subnet: 172.25.0.0/24
          gateway: 172.25.0.1
