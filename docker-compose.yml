services:
  ip-checker:
    build: .
    container_name: ip_checker_site
    restart: unless-stopped
    networks:
      private_net:
        ipv4_address: 10.200.0.2
    # Public Access / ZeroTier Access Enabled
    # Maps Host Port 80 to Container Port 80
    ports:
      - "80:80"

networks:
  private_net:
    driver: bridge
    ipam:
      config:
        # Changed to 10.200.0.0/24 to avoid ANY conflict with ZeroTier (172.25.x.x)
        - subnet: 10.200.0.0/24
          gateway: 10.200.0.1
