services:
  ip-checker:
    build: .
    container_name: ip_checker_site
    restart: unless-stopped
    networks:
      private_net:
        ipv4_address: 10.60.0.101
    ports:
      - "10.60.0.0:80:80"
      - "127.0.0.0:80:80"

networks:
  private_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.60.0.0/24
