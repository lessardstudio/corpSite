services:
  ip-checker:
    build: .
    container_name: ip_checker_site
    restart: unless-stopped
    # Важные права для работы VPN внутри контейнера
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun
    environment:
      # Замените на ваш Network ID из панели ZeroTier!
      - ZT_NETWORK_ID=8185934e6af6ceb3
    volumes:
      # Сохраняем идентификатор устройства (Node ID), чтобы он не менялся при перезапуске
      - zt_data:/var/lib/zerotier-one
    
    # ОТКЛЮЧЕНО: Проброс портов на хост.
    # Так как мы используем ZeroTier внутри контейнера, доступ к сайту будет через ZeroTier IP.
    # Это решает проблему "Bind for 0.0.0.0:80 failed", если на хосте занят 80 порт.
    ports:
      - "80:80"

volumes:
  zt_data:
