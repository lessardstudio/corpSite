<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Checker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }
        .ip-card {
            background-color: #e8f4f8;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            border-left: 5px solid #3498db;
        }
        .ip-label {
            display: block;
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .ip-value {
            font-size: 1.25rem;
            font-weight: bold;
            color: #2c3e50;
            font-family: monospace;
        }
        .footer {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #95a5a6;
        }
        .server-info {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #bdc3c7;
            border-top: 1px solid #eee;
            padding-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ваша IP информация</h1>
        
        <div class="ip-card">
            <span class="ip-label">Ваш текущий IP (как видит сервер)</span>
            <span class="ip-value">{{ visitor_ip }}</span>
        </div>

        <div class="server-info">
            <p>Внутренний IP сервера: {{ server_local_ip }}</p>
            <p>Публичный IP сервера: {{ server_global_ip }}</p>
        </div>
        
        <div class="footer">
            Безопасное соединение через Docker Network<br>
            Subnet: 10.0.0.0/24
        </div>
    </div>
</body>
</html>
